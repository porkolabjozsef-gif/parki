name: Process New Parking App

on:
  issues:
    types: [opened]

jobs:
  process:
    runs-on: ubuntu-latest
    if: contains(github.event.issue.title, 'New parking app:')

    steps:
      - uses: actions/checkout@v4

      - name: Extract app info and update JSON
        run: |
          BODY=$(cat << 'BODYEOF'
          ${{ github.event.issue.body }}
          BODYEOF
          )

          # Markdown bold és sima formátum is támogatott
          PACKAGE=$(echo "$BODY" | grep -oP '(?<=\*\*Csomagnév:\*\* |(?<=Csomagnév: ))[\w.]+' | head -1)
          NAME=$(echo "$BODY" | grep -oP '(?<=\*\*App neve:\*\* |(?<=App neve: )).+' | head -1)
          COUNTRY=$(echo "$BODY" | grep -oP '(?<=\*\*Ország:\*\* |(?<=Ország: )).+' | head -1)
          STORE=$(echo "$BODY" | grep -oP 'https://play\.google\.com/store/apps/details\?id=[\w.]+' | head -1)

          echo "Package: $PACKAGE"
          echo "Name: $NAME"
          echo "Country: $COUNTRY"
          echo "Store: $STORE"

          if [ -z "$PACKAGE" ]; then
            echo "Package name not found, skipping"
            exit 1
          fi

          COUNTRY_CODES=$(echo "$COUNTRY" | tr ',' '\n' | sed 's/[^A-Z]//g' | grep -v '^$' | python3 -c "
          import sys, json
          codes = [line.strip() for line in sys.stdin if line.strip()]
          print(json.dumps(codes))
          ")

          python3 << PYEOF
          import json, urllib.request, re

          with open('parking-apps.json', 'r') as f:
              data = json.load(f)

          existing = [a['packageName'] for a in data['apps']]
          if '$PACKAGE' in existing:
              print(f"Package $PACKAGE already exists, skipping")
              exit(0)

          icon_url = None
          try:
              url = f'https://play.google.com/store/apps/details?id=$PACKAGE&hl=en'
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              html = urllib.request.urlopen(req, timeout=10).read().decode('utf-8')
              match = re.search(r'https://play-lh\.googleusercontent\.com/[A-Za-z0-9_\-]+=', html)
              if match:
                  icon_url = match.group(0) + 's96'
          except Exception as e:
              print(f"Icon fetch failed: {e}")

          new_app = {
              "packageName": "$PACKAGE",
              "displayName": "$NAME",
              "country": $COUNTRY_CODES,
              "storeUrl": "$STORE",
          }
          if icon_url:
              new_app["iconUrl"] = icon_url

          data['apps'].append(new_app)
          data['updated'] = '$(date +%Y-%m-%d)'
          data['version'] = data.get('version', 1) + 1

          with open('parking-apps.json', 'w') as f:
              json.dump(data, f, indent=2, ensure_ascii=False)

          print(f"Added: $PACKAGE")
          PYEOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add parking-apps.json
          git diff --staged --quiet || git commit -m "Add new parking app from issue #${{ github.event.issue.number }}"
          git push

      - name: Close issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '✅ Az alkalmazás sikeresen hozzáadva a listához! A következő szinkronizáláskor megjelenik a Parki appban.'
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });
