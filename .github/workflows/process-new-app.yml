name: Process New Parking App

on:
  issues:
    types: [opened]

jobs:
  process:
    runs-on: ubuntu-latest
    if: contains(github.event.issue.title, 'New parking app:')

    steps:
      - uses: actions/checkout@v4

      - name: Extract app info and update JSON
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python3 << 'PYEOF'
          import os, json, urllib.request, re
          from datetime import date

          body = os.environ.get('ISSUE_BODY', '')
          print("Body:", body[:200])

          # Package name kinyerése
          pkg_match = re.search(r'\*\*Csomagnév:\*\*\s*([\w.]+)|Csomagnév:\s*([\w.]+)', body)
          name_match = re.search(r'\*\*App neve:\*\*\s*(.+)|App neve:\s*(.+)', body)
          country_match = re.search(r'\*\*Ország:\*\*\s*(.+)|Ország:\s*(.+)', body)
          store_match = re.search(r'https://play\.google\.com/store/apps/details\?id=[\w.]+', body)

          package = (pkg_match.group(1) or pkg_match.group(2)).strip() if pkg_match else None
          name = (name_match.group(1) or name_match.group(2)).strip() if name_match else None
          country_str = (country_match.group(1) or country_match.group(2)).strip() if country_match else 'XX'
          store = store_match.group(0).strip() if store_match else ''

          print(f"Package: {package}, Name: {name}, Country: {country_str}")

          if not package:
              print("Package not found!")
              exit(1)

          with open('parking-apps.json', 'r') as f:
              data = json.load(f)

          existing = [a['packageName'] for a in data['apps']]
          if package in existing:
              print(f"Already exists: {package}")
              exit(0)

          # Ikon lekérése
          icon_url = None
          try:
              url = f'https://play.google.com/store/apps/details?id={package}&hl=en'
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              html = urllib.request.urlopen(req, timeout=10).read().decode('utf-8')
              match = re.search(r'https://play-lh\.googleusercontent\.com/[A-Za-z0-9_\-]+=', html)
              if match:
                  icon_url = match.group(0) + 's96'
          except Exception as e:
              print(f"Icon fetch failed: {e}")

          countries = [c.strip() for c in re.split(r'[,\s]+', country_str) if len(c.strip()) == 2]
          if not countries:
              countries = ['XX']

          new_app = {"packageName": package, "displayName": name, "country": countries, "storeUrl": store}
          if icon_url:
              new_app["iconUrl"] = icon_url

          data['apps'].append(new_app)
          data['updated'] = str(date.today())
          data['version'] = data.get('version', 1) + 1

          with open('parking-apps.json', 'w') as f:
              json.dump(data, f, indent=2, ensure_ascii=False)

          print(f"Added: {package}")
          PYEOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add parking-apps.json
          git diff --staged --quiet || git commit -m "Add new parking app from issue #${{ github.event.issue.number }}"
          git push

      - name: Close issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '✅ Az alkalmazás sikeresen hozzáadva a listához! A következő szinkronizáláskor megjelenik a Parki appban.'
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });
